# Employer job systems and job boards polled directly.
# verified: true  = the endpoint was seen working in a public source before it was added.
# verified: false = a probe. After each run, data/health.json shows whether it answered;
#                   prune entries that keep failing.

# Oracle Recruiting Cloud: the public JSON behind each employer's career site.
# sites: [] means "list the employer's career sites first and use the external ones".
