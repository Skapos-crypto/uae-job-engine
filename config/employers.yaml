# Employer job systems and job boards polled directly.
# verified: true  = the employer's own careers page was checked to link to this tenant and site,
#                   and the endpoint was seen answering with that employer's jobs.
# verified: false = a probe. After each run, data/health.json shows whether it answered;
#                   prune entries that keep failing.

# Oracle Recruiting Cloud: the public JSON behind each employer's career site.
# sites must be set: an unknown or inactive siteNumber silently returns another site's jobs.
# Find them with GET https://{host}/hcmRestApi/resources/latest/recruitingCESites?onlyData=true
# (StatusCode ORA_ACTIVE) and check against the link on the employer's careers page.
oracle:
  - {name: ADIB, sector: banking, host: hciq.fa.em2.oraclecloud.com, sites: [CX_1], verified: true}
  - {name: Emirates NBD, sector: banking, host: fa-evlo-saasfaprod1.fa.ocs.oraclecloud.com, sites: [CX_1], verified: true}
  - {name: First Abu Dhabi Bank, sector: banking, host: ehjd.fa.em2.oraclecloud.com, sites: [CX_2001], verified: true}
  - {name: Mashreq, sector: banking, host: hcld.fa.em2.oraclecloud.com, sites: [CX_1], verified: true}
  - {name: du, sector: telecom, host: fa-ewnx-saasfaprod1.fa.ocs.oraclecloud.com, sites: [CX_1001], verified: true}
  - {name: "e&", sector: telecom, host: iaayey.fa.ocs.oraclecloud26.com, sites: [CX_1], verified: true}
  - {name: Emaar, sector: real estate, host: emhm.fa.em2.oraclecloud.com, sites: [CX_1001], verified: true}
  # CX_1 is the main site (global), CX_7001 the internship site
  - {name: DP World, sector: ports and logistics, host: ehpv.fa.em2.oraclecloud.com, sites: [CX_1, CX_7001], verified: true}
  - {name: Dubai Airports, sector: aviation, host: hcrg.fa.em2.oraclecloud.com, sites: [CX_1], verified: true}
  - {name: AD Ports Group, sector: ports and logistics, host: fa-ewzx-saasfaprod1.fa.ocs.oraclecloud.com, sites: [CX_1], verified: true}
  # CX_1001 on this host is the UAE-nationals-only site
  - {name: NMC Healthcare, sector: healthcare, host: eiby.fa.em2.oraclecloud.com, sites: [CX_1], verified: true}
  # PureHealth group: one site per entity; the empty PHG sites are left out
  - {name: PureHealth, sector: healthcare, host: fa-eutv-saasfaprod1.fa.ocs.oraclecloud.com, sites: [CX_6007, CX_8001], verified: true}
  - {name: SEHA, sector: healthcare, host: fa-eutv-saasfaprod1.fa.ocs.oraclecloud.com, sites: [CX_1], verified: true}
  - {name: SSMC, sector: healthcare, host: fa-eutv-saasfaprod1.fa.ocs.oraclecloud.com, sites: [CX_1001], verified: true}
  - {name: Oracle, sector: big tech, host: eeho.fa.us2.oraclecloud.com, sites: [CX_45001], location_id: "300000000106641", verified: true}
  # jobs.dell.com moved from Workday to Oracle; location_id is ignored on this pod, so all ~460 jobs are paged
  - {name: Dell, sector: big tech, host: enterpriseplatform.dell.com, sites: [CX_1001], verified: true}
  # same host as Emirates NBD; emiratesislamic.ae/en/about-us/careers links to CX_2
  - {name: Emirates Islamic, sector: banking, host: fa-evlo-saasfaprod1.fa.ocs.oraclecloud.com, sites: [CX_2], verified: true}
  - {name: KPMG Lower Gulf, sector: consulting, host: elzw.fa.em8.oraclecloud.com, sites: [CX_1001], verified: true}
  # asterdmhealthcare.com/about-us/careers links to CX, the host's only (active) site
  - {name: Aster DM Healthcare, sector: healthcare, host: hcdtgccprod-iayeqy.fa.ocs.oraclecloud.com, sites: [CX], verified: true}

# Phenom career sites: each search-results page carries its jobs as JSON (phApp.ddo).
# robots.txt disallows apply, chatbot and tracking paths, not search or job pages.
phenom:
  - {name: ADCB, sector: banking, base: "https://adcbcareers.com/gb/en", verified: true}
  - {name: G42, sector: AI, base: "https://careers.g42.ai/global/en", verified: true}

# SAP SuccessFactors career sites: the HTML search page (their /services/ RSS is robots-disallowed).
successfactors:
  - {name: EY, sector: consulting, base: "https://careers.ey.com/ey", verified: true}
  - {name: PwC Middle East, sector: consulting, base: "https://careers.pwc.com", verified: true}

# Jibe (iCIMS) career sites: GET {base}/api/jobs. crawl_delay is the site's robots.txt value.
jibe:
  - {name: M42, sector: healthcare, base: "https://careers.m42.ae", crawl_delay: 5, verified: true}

# Checked in November 2026 and not collected:
#   Masdar, Etihad      SmartRecruiters: api.smartrecruiters.com robots.txt disallows all crawlers
#   flydubai            iCIMS: careers-flydubai.icims.com robots.txt is Disallow: /
#   Dubai Islamic Bank  Talentera (Bayt): the job list is loaded by script, no feed found
#   RAKBANK             careers.rakbank.ae serves a TLS certificate for another name
#   Deloitte ME         Avature: lists talent pipelines, not individual jobs
#   talabat             Delivery Hero's own site (Attrax HTML); no collector yet
#   Dubai Holding       Avature (dhcareers.avature.net): 6 jobs a page and no locations in the list,
#                       RSS capped at 20 items; no collector yet
#   TAQA                own site (jobs.taqa.com/vacancies/); no collector yet
#   Wio, Mubadala       careers pages list no jobs and link to no job system
#   ADQ                 no careers page on adq.ae
#   noon                noon.com careers page links only to LinkedIn
#   DEWA, Majid Al Futtaim, Al-Futtaim, Landmark, Deriv: job system not identified yet
#   (JobSpy still picks up their LinkedIn, Indeed and Bayt postings)

# Workday: POST /wday/cxs/{tenant}/{site}/jobs, filtered to UAE locations via the site's own facets.
