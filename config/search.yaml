# JobSpy queries, run once a day (the full run), one query at a time per site with pauses; the
# sites run side by side. 22 queries a day in total. These sites' terms forbid automated access;
# volume is kept low and no account or login is ever used. Remove a site's list to switch it off.
# A blocked query is recorded in data/health.json ("blocked"); it is never retried another way.
# data/health.json also says, per query, how many of its results were kept ("by_query"): use it
# to swap a query that finds nothing for one that does.
#
# Bayt is off (2026-11-13): it refused every query for four runs in a row (403 from GitHub's
# addresses) after refusing most of them since the first week. To try it again, add a list:
#   bayt:
#     - data analyst
# Its three queries went to Indeed, which has answered every query so far (internship, junior,
# product analyst).
#
# Google is off: on 2026-11-02 every Google query returned "no job data returned", both on GitHub
# Actions and from a home connection. Its six queries moved to Indeed and Bayt.
jobspy:
  indeed:
    - data analyst
    - data scientist
    - data engineer
    - business intelligence
    - business analyst
    - software engineer
    - python developer
    - machine learning engineer
    - ai engineer
    - graduate
    - it support
    - internship
    - junior
    - product analyst
  linkedin:
    - data analyst
    - data scientist
    - data engineer
    - business analyst
    - software engineer
    - machine learning engineer
    - graduate
    - product owner

# LinkedIn search results carry no description, so the nationals-only, years and visa checks
# cannot run on them. The full run opens the public page of each NEW LinkedIn role that passed
# the title filters and that no other site describes: at most this many a day, best fit first,
# one page at a time 20 to 40 s apart, never twice for one posting (the facts are cached), none
# for a title that already says UAE nationals, and none after the first refusal. Trial from
# 2026-11-11 (first night: 5 pages read, then a 429). 0 switches it off.
linkedin_pages: 20
