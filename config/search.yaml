# JobSpy queries, run once a day (the 00:13 Dubai full run), one query at a time per site with
# pauses; the sites run side by side. 22 queries a day in total. These sites' terms forbid automated
# access; volume is kept low and no account or login is ever used. Remove a site's list to switch it
# off. A blocked query is recorded in data/health.json ("blocked"); it is never retried another way.
#
# Bayt is down to 3 queries (2026-11-10): it refused 5 to 9 of its 9 queries every day of the first
# week and gave 12 new roles in 9 days.
#
# Google is off: on 2026-11-02 every Google query returned "no job data returned", both on GitHub
# Actions and from a home connection. Its six queries moved to Indeed and Bayt.
jobspy:
  indeed:
    - data analyst
    - data scientist
    - data engineer
    - business intelligence
    - business analyst
    - software engineer
    - python developer
    - machine learning engineer
    - ai engineer
    - graduate
    - it support
  linkedin:
    - data analyst
    - data scientist
    - data engineer
    - business analyst
    - software engineer
    - machine learning engineer
    - graduate
    - product owner
  bayt:
    - data analyst
    - fresh graduate
    - software engineer

# LinkedIn search results carry no description, so the nationals-only, years and visa checks
# cannot run on them. The full run opens the public page of each NEW LinkedIn role that passed
# the title filters and that no other site describes: at most this many a day, best fit first,
# one page at a time 20 to 40 s apart, never twice for one posting (the facts are cached), none
# for a title that already says UAE nationals, and none after the first refusal. Trial from
# 2026-11-11 (first night: 5 pages read, then a 429). 0 switches it off.
linkedin_pages: 20
