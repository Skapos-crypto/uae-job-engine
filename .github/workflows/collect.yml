name: collect-jobs

on:
  # GitHub starts scheduled runs late (6 to 8 hours late in November 2026). These times put both
  # runs before a 14:39 Dubai digest whether they start on time or 8 hours late.
  schedule:
    - cron: "13 20 * * *"  # 00:13 Dubai: full run (job systems, JobSpy sites, board probe)
    - cron: "43 1 * * *"   # 05:43 Dubai: job systems only
  workflow_dispatch:
    inputs:
      full:
        description: "1 = full run including LinkedIn, Indeed and Bayt; 0 = job systems only"
        default: "1"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "config/**"
      - "run.py"
      - "requirements.txt"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect
        env:
          # JobSpy runs once a day (the 00:13 run). Pushes and the 05:43 run collect the job systems
          # only, so a code push never adds a second day's worth of LinkedIn, Indeed and Bayt queries.
          FULL_RUN: ${{ (github.event_name == 'push' || github.event.schedule == '43 1 * * *') && '0' || (github.event.inputs.full || '1') }}
        run: python run.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "jobs: $(TZ=Asia/Dubai date '+%Y-%m-%d %H:%M') Dubai"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
