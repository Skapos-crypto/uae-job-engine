name: collect-jobs

on:
  # GitHub starts scheduled runs late: 4.5 to 8 hours late for this repository in November 2026,
  # once more than 10. No cron line can therefore say when a run happens. Instead the workflow
  # wakes every half hour and engine/when.py decides what the wake-up does: the first one after
  # FULL_AFTER does the full run, the first one after SYSTEMS_AFTER the career-systems run, and
  # every other wake-up exits within seconds. Both times are Dubai time; change them here.
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "1 = full run including the job sites (LinkedIn, Indeed); 0 = career systems only"
        default: "1"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "config/**"
      - "run.py"
      - "requirements.txt"
      - ".github/workflows/collect.yml"

env:
  # The full run searches the job sites once a day. Most UAE postings appear between 09:00 and
  # 18:00, so a run in the early afternoon lists the morning's postings the same day; it has to end
  # before the 14:39 digest that reads data/latest.json. The morning run reads the employers' own
  # career systems only.
  FULL_AFTER: "12:45"
  SYSTEMS_AFTER: "07:00"

permissions:
  contents: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Decide what this wake-up does
        id: when
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FULL: ${{ github.event.inputs.full }}
        run: python3 engine/when.py >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.when.outputs.mode != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.when.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      - name: Collect
        if: steps.when.outputs.mode != 'skip'
        env:
          # The job sites are searched on the full run only, so a code push or the morning run
          # never adds a second day's worth of LinkedIn and Indeed queries.
          FULL_RUN: ${{ steps.when.outputs.mode == 'full' && '1' || '0' }}
        run: python run.py

      - name: Commit results
        if: steps.when.outputs.mode != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "jobs: $(TZ=Asia/Dubai date '+%Y-%m-%d %H:%M') Dubai"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
