name: collect-jobs

on:
  # GitHub starts this repository's scheduled runs 4.5 to 8 hours after the cron time (November
  # 2026), and it keeps only one waiting start per cron line: a line that fires every half hour
  # was started once in 11 hours. So each line below is one wake-up a day, placed where its start
  # has landed so far, and engine/when.py decides what a wake-up does from the Dubai time at which
  # it really starts: the first one after SYSTEMS_AFTER does the career-systems run, the first
  # one after FULL_AFTER the full run, and any other exits within seconds.
  schedule:
    - cron: "13 20 * * *"  # has started between 04:40 and 05:55 Dubai: the career-systems run
    - cron: "43 1 * * *"   # has started between 12:20 and 12:50 Dubai: the full run
    - cron: "13 2 * * *"   # two spare starts for the full run, should the first come before FULL_AFTER
    - cron: "43 2 * * *"
    - cron: "43 8 * * *"   # 12:43 Dubai on the dot: the full run, if GitHub ever starts runs on time
  workflow_dispatch:
    inputs:
      full:
        description: "1 = full run including the job sites (LinkedIn, Indeed); 0 = career systems only"
        default: "1"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "config/**"
      - "run.py"
      - "requirements.txt"
      - ".github/workflows/collect.yml"

env:
  # Dubai time. The full run searches the job sites once a day. Most UAE postings appear between
  # 09:00 and 18:00, so a run around midday lists the morning's postings the same day, and it ends
  # before a 14:39 digest that reads data/latest.json. The early run reads the employers' own
  # career systems only.
  FULL_AFTER: "12:00"
  SYSTEMS_AFTER: "00:30"

permissions:
  contents: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Decide what this wake-up does
        id: when
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FULL: ${{ github.event.inputs.full }}
        run: python3 engine/when.py >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.when.outputs.mode != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.when.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      - name: Collect
        if: steps.when.outputs.mode != 'skip'
        env:
          # The job sites are searched on the full run only, so a code push or the morning run
          # never adds a second day's worth of LinkedIn and Indeed queries.
          FULL_RUN: ${{ steps.when.outputs.mode == 'full' && '1' || '0' }}
        run: python run.py

      - name: Commit results
        if: steps.when.outputs.mode != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "jobs: $(TZ=Asia/Dubai date '+%Y-%m-%d %H:%M') Dubai"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
