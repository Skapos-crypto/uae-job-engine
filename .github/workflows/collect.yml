name: collect-jobs

on:
  schedule:
    - cron: "13 1 * * *"   # 05:13 Dubai: full run (job systems, JobSpy sites, board probe)
    - cron: "43 8 * * *"   # 12:43 Dubai: job systems only, fresh before the 14:39 digest
  workflow_dispatch:
    inputs:
      full:
        description: "1 = full run including LinkedIn, Indeed, Google and Bayt; 0 = job systems only"
        default: "1"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "config/**"
      - "run.py"
      - "requirements.txt"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect
        env:
          # JobSpy runs once a day (05:13). Pushes and the midday run collect the job systems only,
          # so a code push never adds a second day's worth of LinkedIn, Indeed and Bayt queries.
          FULL_RUN: ${{ (github.event_name == 'push' || github.event.schedule == '43 8 * * *') && '0' || (github.event.inputs.full || '1') }}
        run: python run.py

      - name: Commit results
        run: |
          git config user.name "Skapos-crypto"
          git config user.email "85958064+Skapos-crypto@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "jobs: $(TZ=Asia/Dubai date '+%Y-%m-%d %H:%M') Dubai"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
